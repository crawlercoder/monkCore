# ALB (or public) on :80 — nginx in front of Next.js, which binds :9000.
# Install: sudo cp scripts/nginx/hackathon-port9000.conf /etc/nginx/sites-available/
#          sudo ln -sf /etc/nginx/sites-available/hackathon-port9000.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Next.js (``web/package.json``) listens on 9000. Nginx can listen on 80/443
# and forward here; you cannot have nginx and Next both bind to the same port.
#
# If the load balancer targets :9000 on the host, run only Next (no nginx on
# ``9000``), e.g. ``cd web && API_PROXY_TARGET=http://127.0.0.1:8000 npm start``
#
# Stop other processes on :80 or :9000 as needed before reload.

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name utkarsh-gu-ai.hackathon.lenskart.com _;

  location / {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
